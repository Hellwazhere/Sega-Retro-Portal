</head>
<body>
    <header>
        <h1>Project Info</h1>
        <nav>
         <a href="index.html">Home</a>
            <a href="hardware.html">Hardware</a> 
            <a href="archive.html">Archive</a>

            <a href="dreamcast.html">Dreamcast</a>

        </nav>

    <main>
        <section class="hero">
            <h2 style="display: block; text-align: center; border: none; padding: 0; width: 100%;">Digital Preservation</h2>
            <p>Sega Retro Portal 2026 is a mission-driven project dedicated to the history of SEGA consoles.</p>
        </section>

        <section id="contact-section" style="display: flex; flex-direction: column; align-items: center; width: 100%; padding: 4rem 0;">
            <h2 style="color: var(--accent); font-size: 2.5rem; margin-bottom: 1rem;">Have any rarities?</h2>
            <p style="margin-bottom: 3rem; color: #ccc;">Share it with us below.</p>
            
            <form class="contact-form" action="https://formspree.io/f/MANDA_AQUI_O_TEU_ID" method="POST" enctype="multipart/form-data" 
                  style="width: 100%; max-width: 500px; background: rgba(0, 0, 0, 0.4); padding: 2.5rem; border-radius: 15px; border: 1px solid var(--accent);">
                
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label style="color: var(--accent); font-weight: bold; text-transform: uppercase; font-size: 0.8rem;">Gamer Name</label>
                    <input type="text" name="name" placeholder="Enter your handle..." required style="width: 100%; padding: 12px; background: #111; border: 1px solid #444; color: white;">
                </div>
                
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label style="color: var(--accent); font-weight: bold; text-transform: uppercase; font-size: 0.8rem;">Gamer Email</label>
                    <input type="email" name="_replyto" required style="width: 100%; padding: 12px; background: #111; border: 1px solid #444; color: white;">
                </div>

                <div class="form-group" style="margin-bottom: 2rem;">
                    <label style="color: var(--accent); font-weight: bold; text-transform: uppercase; font-size: 0.8rem;">Information</label>
                    <textarea name="message" rows="6" required style="width: 100%; padding: 12px; background: #111; border: 1px solid #444; color: white;"></textarea>
                </div>
                
                <button type="submit" class="submit-btn" style="width: 100%; padding: 15px; background: var(--accent); color: black; font-weight: bold; cursor: pointer;">Transmit Data</button>
            </form>
        </section>
    </main>

    <footer>// END OF LINE // SEGA RETRO PORTAL 2026</footer>

    <script src="script.js"></script>
</body>
</html>
